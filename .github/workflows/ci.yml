name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, CLI, and offline tests
    if: >-
      github.repository == 'mjfrancese/SolidGround' &&
      github.repository_owner == 'mjfrancese' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: solidground-pve2
    timeout-minutes: 10
    # The Homelab runner pod is unprivileged, so the SDK must install under the runner's writable temp directory instead of /usr/share/dotnet.
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Assert trusted Homelab routing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mjfrancese/SolidGround"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$RUNNER_NAME" in
            solidground-pve2-*)
              echo "runner_name=$RUNNER_NAME runner_os=$RUNNER_OS"
              ;;
            *)
              echo "Unexpected runner identity: $RUNNER_NAME" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore SolidGround.slnx --locked-mode

      - name: Build
        run: dotnet build SolidGround.slnx --configuration Release --no-restore

      - name: Run offline tests
        run: dotnet test --project tests/SolidGround.Tests/SolidGround.Tests.csproj --configuration Release --no-build
